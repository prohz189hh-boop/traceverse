name: Bug report
description: Report a reproducible problem in TraceVerse.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Please remove private telemetry, tokens, and personal data. Report security vulnerabilities using SECURITY.md instead of this public form.
  - type: input
    id: version
    attributes:
      label: TraceVerse version or commit
      placeholder: v0.2.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and browser/version; Node version for the local app. For graphics problems, include quality preset, reduced-motion setting, and graphics renderer if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the public-demo route/scenario or exact local command, and a small sanitized example. Do not attach real private trace exports.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant sanitized errors or an actual screenshot.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Application build
      options:
        - Public GitHub Pages demo
        - Local static preview (4173/traceverse/)
        - Local development application (5173)
        - Local production application (4318)
        - SDK or collector only
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Dashboard mode
      options:
        - Live
        - Demo (real local services)
        - Synthetic (bundled demonstration data)
        - Replay
        - Not applicable
  - type: input
    id: scenario
    attributes:
      label: Scenario, route, or affected control
      placeholder: Slow database, /traceverse/#/traces, reset camera, or a sanitized operation name
