name: Feature request
description: Propose a useful improvement with a concrete use case.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Keep examples synthetic or sanitized. The public demo must remain free, static, and isolated from real telemetry; the local application supports real OpenTelemetry traces.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would expect in TraceVerse.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Smallest useful outcome
      description: Suggest a focused acceptance criterion and identify whether this affects the public demo, local app, or SDK.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Include workarounds or telemetry that would be required. Keep private data out of examples.
